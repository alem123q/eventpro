services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # "backend" es el nombre con el que el frontend llega a este servicio
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - FRONTEND_URL=https://localhost:5173
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite reenvia /api y /media a este servicio (ver frontend/vite.config.js)
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
